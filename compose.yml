# PostgreSQL untuk SIMRS dr. Tjahyo (lingkungan lokal/development).
#
#   docker compose up -d      nyalakan
#   docker compose ps         cek status
#   docker compose stop       hentikan (data tetap aman)
#   docker compose down -v    HAPUS container + data (jangan dijalankan)
#
# Kredensial dibaca dari file .env (lihat .env.example).
# Nilai default di bawah hanya untuk development lokal dan tidak pernah
# dipakai di produksi.

services:
  postgres:
    image: postgres:16-alpine
    container_name: simrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-simrs}
      POSTGRES_USER: ${DB_USERNAME:-simrs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-simrs_local_dev}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      # Hanya bisa diakses dari komputer ini. Jangan ubah ke "5432:5432"
      # kecuali benar-benar paham risikonya.
      - "127.0.0.1:5432:5432"
    volumes:
      - simrs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-simrs} -d ${DB_DATABASE:-simrs}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  simrs-pgdata:
